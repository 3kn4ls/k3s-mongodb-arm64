apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: mongodb
data:
  mongod.conf: |
    # Configuración de MongoDB optimizada para Raspberry Pi 5 (ARM64)

    # Network settings
    net:
      port: 27017
      bindIp: 0.0.0.0
      maxIncomingConnections: 100

    # Storage settings
    storage:
      dbPath: /data/db
      journal:
        enabled: true
      engine: wiredTiger
      wiredTiger:
        engineConfig:
          # Reducir cache para Raspberry Pi (ajustar según RAM disponible)
          cacheSizeGB: 0.5
          journalCompressor: snappy
        collectionConfig:
          blockCompressor: snappy

    # Security settings
    security:
      authorization: enabled

    # Operationprofiling
    operationProfiling:
      mode: slowOp
      slowOpThresholdMs: 100

    # Replication (descomentar si se configura replica set)
    # replication:
    #   replSetName: rs0

    # System log
    systemLog:
      destination: file
      path: /data/db/mongod.log
      logAppend: true
      verbosity: 0

  init-mongo.js: |
    // Script de inicialización de MongoDB
    // Se ejecuta automáticamente al crear la base de datos

    db = db.getSiblingDB('admin');

    // Crear usuario administrador si no existe
    if (!db.getUser(process.env.MONGO_INITDB_ROOT_USERNAME)) {
      db.createUser({
        user: process.env.MONGO_INITDB_ROOT_USERNAME,
        pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
        roles: [
          { role: 'userAdminAnyDatabase', db: 'admin' },
          { role: 'readWriteAnyDatabase', db: 'admin' },
          { role: 'dbAdminAnyDatabase', db: 'admin' },
          { role: 'clusterAdmin', db: 'admin' }
        ]
      });
    }

    // Crear base de datos de aplicación
    db = db.getSiblingDB('myapp');

    // Crear colección de ejemplo
    db.createCollection('users');

    print('MongoDB initialization completed');
